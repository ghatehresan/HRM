name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test -v 2>&1 | tee pint-${{ matrix.php }}.log; test ${PIPESTATUS[0]} -eq 0

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # The suite runs under BOTH timezones: date helpers must be
      # DST-immune (see Jalali::monthRange). Unit tests honor TZ;
      # feature tests boot Laravel (UTC) either way.
      - name: Execute tests (UTC)
        run: TZ=UTC php artisan test --log-junit=junit-utc-${{ matrix.php }}.xml

      - name: Execute tests (Asia/Tehran)
        run: TZ=Asia/Tehran php artisan test --log-junit=junit-tehran-${{ matrix.php }}.xml

      - name: Audit dependencies
        run: composer audit

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-php-${{ matrix.php }}
          path: |
            pint-${{ matrix.php }}.log
            junit-utc-${{ matrix.php }}.xml
            junit-tehran-${{ matrix.php }}.xml
          if-no-files-found: ignore

  test-mariadb:
    runs-on: ubuntu-latest

    name: Tests on MariaDB 10.6

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: hrm_secret
          MYSQL_DATABASE: hrm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Real environment variables take precedence over phpunit.xml <env>,
      # so this leg runs the SAME suite against MariaDB 10.6 (the XAMPP /
      # deployment engine, utf8mb4_persian_ci collation). One timezone leg
      # is enough here — DST-immunity is covered by the sqlite matrix.
      # Oracle MySQL 8.0 compatibility is UNVERIFIED (see DATABASE.md).
      - name: Execute tests (MariaDB 10.6)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrm_test
          DB_USERNAME: root
          DB_PASSWORD: hrm_secret
        run: TZ=UTC php artisan test --log-junit=junit-mariadb.xml

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-mariadb
          path: junit-mariadb.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest

    name: Frontend build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
