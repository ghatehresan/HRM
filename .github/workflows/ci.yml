name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest

    # TEMPORARY (M1): contents:write only so the debug step below can post
    # a commit comment. Revert to the top-level contents:read before merging.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: |
          set -o pipefail
          vendor/bin/pint --test -v 2>&1 | tee pint-output.txt

      # TEMPORARY (M1 sandbox has no access to CI logs): if Pint fails,
      # apply its fixes and post the exact diff as a commit comment so the
      # required changes are visible. REMOVE before merging to main.
      - name: TEMPORARY — report pint diff
        if: failure() && matrix.php == '8.4'
        run: |
          vendor/bin/pint >/dev/null 2>&1 || true
          git diff -- app routes config database tests > pint-diff.txt || true
          BODY="TEMPORARY M1 DEBUG — what Pint wants to change:"$'\n```diff\n'"$(head -c 55000 pint-diff.txt)"$'\n```'
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # The suite runs under BOTH timezones: date helpers must be
      # DST-immune (see Jalali::monthRange). Unit tests honor TZ;
      # feature tests boot Laravel (UTC) either way.
      - name: Execute tests (UTC)
        run: TZ=UTC php artisan test

      - name: Execute tests (Asia/Tehran)
        run: TZ=Asia/Tehran php artisan test

      - name: Audit dependencies
        run: composer audit

  frontend:
    runs-on: ubuntu-latest

    name: Frontend build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
